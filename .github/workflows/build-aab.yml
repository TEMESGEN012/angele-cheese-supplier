name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create matching google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{ "project_info": { "project_number": "123456789", "project_id": "angel-cheese-supplier" }, "client": [{ "client_info": { "mobilesdk_app_id": "1:123456789:android:123456", "android_client_info": { "package_name": "com.aistudio.dairyflow.hedriq" } }, "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }], "configuration_version": "1" }' > app/google-services.json
          fi

      - name: Build Release AAB Bundle
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
